<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      background-color: #ce1126;
      width: 900px;
      height: 600px;
      position: relative;
    }

    /* Blue rectangle child of the Red rectangle */
    .flag > div{
      background-color: #002868;
      height: 50%;
      width: 100%;
      position: absolute;
      top: 150px;

    }

    /* White circle child of the Bleu rectangle */
    .flag > div > div{
      background-color: #fff;
      height: 200px;
      width: 200px;
      border-radius: 50%;
      position: relative;
      left: 350px ;
      top: 50px;
    }
    p{
      margin: 0;
      font-size: 5rem;
      text-align: center;
      color: #fff;
    }
    .flag  div  div  p{
      color: black;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
